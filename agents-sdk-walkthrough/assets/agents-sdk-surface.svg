<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#fafaf9"/>

  <!-- capability boxes (top row) -->
  <rect x="28" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="95" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">@agents.tool</text>
  <text x="95" y="76" text-anchor="middle" font-size="11" fill="#71717a">typed Python tools</text>

  <rect x="174" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="241" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">hooks</text>
  <text x="241" y="76" text-anchor="middle" font-size="11" fill="#71717a">pre/post_tool_call</text>

  <rect x="320" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="387" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">subagents</text>
  <text x="387" y="76" text-anchor="middle" font-size="11" fill="#71717a">ParentHarness</text>

  <rect x="466" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="533" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">permission</text>
  <text x="533" y="76" text-anchor="middle" font-size="11" fill="#71717a">ALLOW / ASK / DENY</text>

  <rect x="612" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="679" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">sandbox</text>
  <text x="679" y="76" text-anchor="middle" font-size="11" fill="#71717a">create / execute / delete</text>

  <rect x="758" y="28" width="134" height="72" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="825" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#18181b">connectors + MCP</text>
  <text x="825" y="76" text-anchor="middle" font-size="11" fill="#71717a">Studio + remote</text>

  <!-- arrows from capabilities into the agent -->
  <line x1="95" y1="100" x2="360" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="241" y1="100" x2="410" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="387" y1="100" x2="460" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="533" y1="100" x2="510" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="679" y1="100" x2="560" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="100" x2="600" y2="178" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- session (left) -->
  <rect x="28" y="200" width="190" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="123" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">Session</text>
  <text x="123" y="246" text-anchor="middle" font-size="11" fill="#71717a">records every step; snapshot + resume</text>
  <line x1="218" y1="232" x2="306" y2="232" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- the agent (center) -->
  <rect x="310" y="180" width="300" height="104" rx="12" fill="#fff7ed" stroke="#ff7000" stroke-width="2"/>
  <text x="460" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">agents.Agent</text>
  <text x="460" y="236" text-anchor="middle" font-size="12" fill="#71717a">model + instructions</text>
  <text x="460" y="254" text-anchor="middle" font-size="12" fill="#71717a">the harness runs the model/tool loop</text>

  <!-- VibeHarness (right, dashed = reusable bundle) -->
  <rect x="650" y="200" width="242" height="64" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="771" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">VibeHarness</text>
  <text x="771" y="246" text-anchor="middle" font-size="11" fill="#71717a">bundle tools + hooks + sandbox for reuse</text>
  <line x1="646" y1="232" x2="614" y2="232" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrows from agent to run modes -->
  <line x1="400" y1="284" x2="159" y2="396" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="284" x2="460" y2="396" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="284" x2="761" y2="396" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- run modes (bottom row) -->
  <rect x="28" y="400" width="262" height="96" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="159" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">Your process</text>
  <text x="159" y="456" text-anchor="middle" font-size="11" fill="#71717a">agent.run() / agents chat</text>
  <text x="159" y="474" text-anchor="middle" font-size="11" fill="#71717a">session lives in memory</text>

  <rect x="329" y="400" width="262" height="96" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="460" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">agents serve</text>
  <text x="460" y="456" text-anchor="middle" font-size="11" fill="#71717a">self-hosted worker on your servers</text>
  <text x="460" y="474" text-anchor="middle" font-size="11" fill="#71717a">Mistral stores the sessions</text>

  <rect x="630" y="400" width="262" height="96" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="761" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">agents deploy</text>
  <text x="761" y="456" text-anchor="middle" font-size="11" fill="#71717a">Mistral-managed, nothing to host</text>
  <text x="761" y="474" text-anchor="middle" font-size="11" fill="#71717a">durable execution + crash recovery</text>

  <text x="460" y="536" text-anchor="middle" font-size="13" font-style="italic" fill="#71717a">One Agent declaration, three run modes.</text>
</svg>
