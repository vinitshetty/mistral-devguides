name: Build guide catalog

# Regenerates docs/guides.json whenever guides change, so the GitHub Pages
# catalog always reflects the repo. A guide folder is picked up by simply
# pushing <my-guide>/index.md to main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/guides.json" # avoids re-run loops from bot commits

permissions:
  contents: write

concurrency:
  group: build-guide-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history needed for guide dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate guides and build index
        run: python scripts/build_index.py

      - name: Commit regenerated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guides.json
          if git diff --cached --quiet; then
            echo "guides.json unchanged"
          else
            git commit -m "Regenerate guides.json catalog index"
            git push
          fi
