<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#fafaf9"/>

  <!-- input -->
  <rect x="310" y="18" width="300" height="50" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="460" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">invoices/*.jpg</text>
  <text x="460" y="57" text-anchor="middle" font-size="12" fill="#71717a">18 real invoice photos</text>

  <!-- arrow -->
  <line x1="460" y1="68" x2="460" y2="92" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OCR -->
  <rect x="310" y="96" width="300" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="460" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">process_document_ocr</text>
  <text x="460" y="140" text-anchor="middle" font-size="12" fill="#71717a">Mistral OCR → markdown per page</text>

  <line x1="460" y1="158" x2="460" y2="182" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- extract -->
  <rect x="310" y="186" width="300" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="460" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">extract_invoice_data</text>
  <text x="460" y="230" text-anchor="middle" font-size="12" fill="#71717a">chat + strict JSON schema → InvoiceData</text>

  <line x1="460" y1="248" x2="460" y2="272" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- enrich -->
  <rect x="310" y="276" width="300" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="460" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">data_enrichment_with_mcp</text>
  <text x="460" y="320" text-anchor="middle" font-size="12" fill="#71717a">CRM lookup → EnrichedInvoiceData</text>

  <line x1="460" y1="338" x2="460" y2="362" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="460,366 560,411 460,456 360,411" fill="#fff7ed" stroke="#ff7000" stroke-width="1.5"/>
  <text x="460" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">total &gt; $3,000?</text>
  <text x="460" y="423" text-anchor="middle" font-size="12" fill="#71717a">human gate</text>

  <!-- yes branch to approval -->
  <line x1="560" y1="411" x2="628" y2="411" stroke="#ff7000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="594" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#ff7000">yes</text>

  <rect x="632" y="380" width="270" height="62" rx="10" fill="#fff7ed" stroke="#ff7000" stroke-width="1.5"/>
  <text x="767" y="404" text-anchor="middle" font-size="14" font-weight="600" fill="#18181b">pause for human approval</text>
  <text x="767" y="424" text-anchor="middle" font-size="12" fill="#71717a">wait_for_input → approve / reject signal</text>

  <!-- approval rejoin -->
  <path d="M 767 442 L 767 496 L 472 496" fill="none" stroke="#ff7000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- no branch -->
  <line x1="460" y1="456" x2="460" y2="480" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="476" y="472" font-size="12" font-weight="600" fill="#71717a">no</text>

  <!-- summary -->
  <rect x="310" y="484" width="300" height="50" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="460" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#18181b">final summary</text>
  <text x="460" y="522" text-anchor="middle" font-size="12" fill="#71717a">structured result + Le Chat message</text>

  <!-- side label -->
  <text x="24" y="60" font-size="12" fill="#a1a1aa">durable workflow: every step checkpointed</text>
  <text x="24" y="78" font-size="12" fill="#a1a1aa">ocr_invoice_workflow_test</text>
</svg>
